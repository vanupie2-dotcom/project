<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Digital Clock</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #080b1e, #151b38, #090d20);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.4s;
    padding: 20px;
}

body.light {
    background: linear-gradient(135deg, #e5eaff, #c8d5ff);
    color: #17203c;
}

.container {
    width: 100%;
    max-width: 750px;
    padding: 40px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
}

body.light .container {
    background: rgba(255,255,255,0.65);
    border-color: rgba(0,0,0,0.1);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #55dfff;
}

.theme-btn {
    background: transparent;
    border: 1px solid #55dfff;
    color: inherit;
    padding: 10px 15px;
    border-radius: 20px;
    cursor: pointer;
}

h1 {
    font-size: 16px;
    letter-spacing: 5px;
    opacity: 0.7;
    margin-bottom: 25px;
}

.clock {
    font-size: clamp(48px, 11vw, 90px);
    font-weight: 700;
    color: #55dfff;
    text-shadow: 0 0 25px rgba(85,223,255,0.5);
    letter-spacing: 3px;
    white-space: nowrap;
}

.ampm {
    font-size: 22px;
    color: #b58cff;
}

.date {
    font-size: 21px;
    margin-top: 20px;
}

.day {
    margin-top: 10px;
    color: #55dfff;
    font-size: 16px;
}

.divider {
    height: 1px;
    background: rgba(255,255,255,0.2);
    margin: 35px 0;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    background: #55dfff;
    color: #071326;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px);
    background: white;
}

.secondary {
    background: #b58cff;
}

.stopwatch {
    margin-top: 30px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.06);
}

.stopwatch h2 {
    font-size: 17px;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

#stopwatchDisplay {
    font-size: 35px;
    color: #b58cff;
    margin-bottom: 18px;
    font-weight: bold;
}

.stopwatch button {
    margin: 5px;
}

.footer {
    margin-top: 30px;
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 2px;
}

@media(max-width: 500px) {
    .container {
        padding: 25px 15px;
    }

    .top {
        margin-bottom: 30px;
    }

    .logo {
        font-size: 17px;
    }

    .date {
        font-size: 16px;
    }

    .clock {
        letter-spacing: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="logo">✦ TIMEZONE</div>
        <button class="theme-btn" onclick="toggleTheme()">
            🌙 Theme
        </button>
    </div>

    <h1>PROFESSIONAL DIGITAL CLOCK</h1>

    <div>
        <span class="clock" id="clock">00:00:00</span>
        <span class="ampm" id="ampm">AM</span>
    </div>

    <div class="date" id="date"></div>
    <div class="day" id="day"></div>

    <div class="divider"></div>

    <div class="controls">
        <button onclick="toggleFormat()">
            12H / 24H
        </button>

        <button class="secondary" onclick="toggleTheme()">
            Change Theme
        </button>
    </div>

    <div class="stopwatch">

        <h2>STOPWATCH</h2>

        <div id="stopwatchDisplay">00:00:00</div>

        <button onclick="startWatch()">Start</button>
        <button class="secondary" onclick="pauseWatch()">Pause</button>
        <button onclick="resetWatch()">Reset</button>

    </div>

    <div class="footer">
        DESIGNED WITH HTML • CSS • JAVASCRIPT
    </div>

</div>

<script>

let is24Hour = false;

// DIGITAL CLOCK

function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    let ampm = hours >= 12 ? "PM" : "AM";

    if (!is24Hour) {
        hours = hours % 12 || 12;
    }

    let h = String(hours).padStart(2, "0");
    let m = String(minutes).padStart(2, "0");
    let s = String(seconds).padStart(2, "0");

    document.getElementById("clock").textContent =
        `${h}:${m}:${s}`;

    document.getElementById("ampm").textContent =
        is24Hour ? "" : ampm;

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    document.getElementById("day").textContent =
        now.toLocaleDateString("en-IN", {
            weekday: "long"
        });

}

function toggleFormat() {
    is24Hour = !is24Hour;
    updateClock();
}

setInterval(updateClock, 1000);
updateClock();


// DARK AND LIGHT THEME

function toggleTheme() {
    document.body.classList.toggle("light");
}


// STOPWATCH

let elapsed = 0;
let startTime = 0;
let timer = null;

function formatTime(ms) {

    let totalSeconds = Math.floor(ms / 1000);

    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;

    return [
        hours,
        minutes,
        seconds
    ].map(n => String(n).padStart(2, "0")).join(":");

}

function updateStopwatch() {
    elapsed = Date.now() - startTime;
    document.getElementById("stopwatchDisplay").textContent =
        formatTime(elapsed);
}

function startWatch() {

    if (timer !== null) return;

    startTime = Date.now() - elapsed;

    timer = setInterval(updateStopwatch, 100);

}

function pauseWatch() {

    if (timer !== null) {
        clearInterval(timer);
        timer = null;
        updateStopwatch();
    }

}

function resetWatch() {

    clearInterval(timer);
    timer = null;
    elapsed = 0;

    document.getElementById("stopwatchDisplay").textContent =
        "00:00:00";

}

</script>

</body>
</html>

</body>
</html>
