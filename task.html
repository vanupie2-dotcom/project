
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow | Task Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #0b1020;
    --panel: #131a2d;
    --panel-light: #1b243b;
    --text: #f4f7ff;
    --muted: #9aa7c2;
    --primary: #8b7cff;
    --border: #28334d;
    --green: #35d6a1;
    --red: #ff7085;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 35px 16px;
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at top left, #272050 0, transparent 35%),
        radial-gradient(circle at bottom right, #102f43 0, transparent 30%),
        var(--bg);
    color: var(--text);
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 35px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    display: grid;
    place-items: center;
    width: 45px;
    height: 45px;
    border-radius: 14px;
    background: linear-gradient(135deg, #a394ff, #6554ed);
    font-size: 23px;
    box-shadow: 0 8px 25px #7565ff35;
}

.logo h1 {
    font-size: 23px;
    letter-spacing: -1px;
}

.logo p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.date {
    color: var(--muted);
    font-size: 13px;
    text-align: right;
}

.hero {
    margin-bottom: 28px;
}

.hero h2 {
    font-size: clamp(28px, 5vw, 43px);
    letter-spacing: -1.5px;
    margin-bottom: 10px;
}

.hero h2 span {
    color: var(--primary);
}

.hero p {
    color: var(--muted);
    line-height: 1.7;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: #131a2de8;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    transition: transform .2s, border-color .2s;
}

.stat-card:hover {
    transform: translateY(-3px);
    border-color: #6554ed;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 17px;
}

.stat-icon {
    font-size: 20px;
}

.stat-card h3 {
    font-size: 31px;
}

.stat-card small {
    display: block;
    color: var(--muted);
    margin-top: 7px;
}

.main-card {
    background: #131a2df2;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 70px #00000018;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.section-heading h3 {
    font-size: 20px;
}

.task-count {
    color: var(--muted);
    font-size: 12px;
}

.task-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 145px 125px auto;
    gap: 10px;
    margin-bottom: 22px;
}

input, select, button {
    font: inherit;
}

.task-form input,
.task-form select,
.search-box,
.filter-select {
    width: 100%;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 11px;
    outline: none;
    padding: 13px 14px;
    min-width: 0;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px #8b7cff18;
}

select option {
    background: var(--panel);
}

.btn {
    border: none;
    border-radius: 11px;
    padding: 12px 17px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.btn-primary {
    background: linear-gradient(135deg, #a394ff, #7461f4);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 22px #8b7cff35;
}

.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
}

.search-box {
    flex: 1;
}

.filter-select {
    width: 165px;
    cursor: pointer;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px;
    border: 1px solid var(--border);
    background: #171f33;
    border-radius: 14px;
    transition: border-color .2s;
    animation: appear .25s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.task-item:hover {
    border-color: #4c5878;
}

.check-btn {
    width: 23px;
    height: 23px;
    flex-shrink: 0;
    border: 2px solid #56627d;
    background: transparent;
    border-radius: 7px;
    color: white;
    cursor: pointer;
    font-size: 14px;
    display: grid;
    place-items: center;
}

.check-btn.checked {
    background: var(--green);
    border-color: var(--green);
    color: #071a16;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 14px;
    font-weight: 600;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.task-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 8px;
}

.priority {
    font-size: 10px;
    font-weight: 800;
    padding: 5px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.priority.Low {
    background: #35d6a119;
    color: var(--green);
}

.priority.Medium {
    background: #ffca681b;
    color: #ffca68;
}

.priority.High {
    background: #ff70851b;
    color: var(--red);
}

.task-date {
    font-size: 11px;
    color: var(--muted);
}

.completed .task-title {
    color: #78839c;
    text-decoration: line-through;
}

.completed .task-item {
    opacity: .7;
}

.task-actions {
    display: flex;
    gap: 7px;
}

.action-btn {
    display: grid;
    place-items: center;
    width: 35px;
    height: 35px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
}

.action-btn:hover {
    color: white;
    background: var(--panel-light);
}

.action-btn.delete:hover {
    color: var(--red);
    border-color: #ff708555;
}

.empty-state {
    text-align: center;
    padding: 50px 15px;
    color: var(--muted);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.empty-state h4 {
    color: var(--text);
    margin-bottom: 8px;
}

.footer {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    margin-top: 23px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
}

.clear-btn {
    color: var(--red);
    background: transparent;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

.toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translate(-50%, 20px);
    background: #202b43;
    border: 1px solid #3c4967;
    color: white;
    padding: 13px 20px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 10;
    font-size: 13px;
    max-width: calc(100% - 30px);
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

@media (max-width: 750px) {
    .task-form {
        grid-template-columns: 1fr 1fr;
    }

    .task-form input {
        grid-column: 1 / -1;
    }

    .task-form .btn {
        grid-column: 1 / -1;
    }

    .stats {
        gap: 9px;
    }

    .stat-card {
        padding: 15px;
    }

    .stat-card h3 {
        font-size: 25px;
    }

    .stat-top {
        font-size: 11px;
        gap: 5px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 22px 11px;
    }

    .logo h1 {
        font-size: 19px;
    }

    .date {
        font-size: 11px;
    }

    .main-card {
        padding: 15px;
    }

    .toolbar {
        flex-direction: column;
    }

    .filter-select {
        width: 100%;
    }

    .task-item {
        padding: 12px;
        gap: 9px;
    }

    .task-actions {
        flex-direction: column;
    }

    .task-meta {
        gap: 6px;
    }
}
</style>
</head>

<body>
<div class="container">

    <header>
        <div class="logo">
            <div class="logo-icon">✓</div>
            <div>
                <h1>TaskFlow</h1>
                <p>Your personal productivity space</p>
            </div>
        </div>
        <div class="date" id="todayDate"></div>
    </header>

    <section class="hero">
        <h2>Make today <span>count.</span></h2>
        <p>Organize your tasks, focus on your goals, and get things done.</p>
    </section>

    <section class="stats">
        <div class="stat-card">
            <div class="stat-top">
                Total Tasks <span class="stat-icon">📋</span>
            </div>
            <h3 id="totalCount">0</h3>
            <small>All your tasks</small>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                Pending <span class="stat-icon">⏳</span>
            </div>
            <h3 id="pendingCount">0</h3>
            <small>Still to complete</small>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                Completed <span class="stat-icon">🎯</span>
            </div>
            <h3 id="completedCount">0</h3>
            <small>Tasks finished</small>
        </div>
    </section>

    <main class="main-card">
        <div class="section-heading">
            <h3>My Tasks</h3>
            <span class="task-count" id="taskCountLabel">0 tasks</span>
        </div>

        <form class="task-form" id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                maxlength="150"
                required
                aria-label="Task title"
            >

            <select id="priorityInput" aria-label="Select priority">
                <option value="Low">🟢 Low Priority</option>
                <option value="Medium" selected>🟡 Medium Priority</option>
                <option value="High">🔴 High Priority</option>
            </select>

            <input type="date" id="dueDateInput" aria-label="Due date">

            <button type="submit" class="btn btn-primary" id="submitBtn">
                + Add Task
            </button>
        </form>

        <div class="toolbar">
            <input
                class="search-box"
                type="search"
                id="searchInput"
                placeholder="🔍  Search tasks..."
                aria-label="Search tasks"
            >

            <select class="filter-select" id="filterInput" aria-label="Filter tasks">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <div class="task-list" id="taskList"></div>

        <div class="footer">
            <span id="footerMessage">Small steps lead to big results ✨</span>
            <button class="clear-btn" id="clearCompletedBtn" type="button">
                Clear completed
            </button>
        </div>
    </main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const priorityInput = document.getElementById("priorityInput");
const dueDateInput = document.getElementById("dueDateInput");
const taskList = document.getElementById("taskList");
const searchInput = document.getElementById("searchInput");
const filterInput = document.getElementById("filterInput");
const submitBtn = document.getElementById("submitBtn");
const toast = document.getElementById("toast");

let tasks = [];

try {
    const savedTasks = JSON.parse(localStorage.getItem("taskflow-tasks"));
    if (Array.isArray(savedTasks)) tasks = savedTasks;
} catch (error) {
    tasks = [];
}

let editingId = null;
let toastTimer;

document.getElementById("todayDate").textContent =
    new Date().toLocaleDateString("en-IN", {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
    });

function saveTasks() {
    try {
        localStorage.setItem("taskflow-tasks", JSON.stringify(tasks));
    } catch (error) {
        showToast("Could not save tasks in this browser.");
    }
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2300);
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function formatDate(dateString) {
    if (!dateString) return "No due date";

    const date = new Date(dateString + "T00:00:00");
    return "Due " + date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}

function updateStats() {
    const completed = tasks.filter(task => task.completed).length;
    const pending = tasks.length - completed;

    document.getElementById("totalCount").textContent = tasks.length;
    document.getElementById("pendingCount").textContent = pending;
    document.getElementById("completedCount").textContent = completed;
    document.getElementById("taskCountLabel").textContent =
        tasks.length + (tasks.length === 1 ? " task" : " tasks");

    document.getElementById("footerMessage").textContent =
        tasks.length === 0
            ? "A fresh start awaits ✨"
            : completed === tasks.length
                ? "Amazing! All tasks completed 🎉"
                : "You're making progress. Keep going ✨";
}

function renderTasks() {
    const query = searchInput.value.trim().toLowerCase();
    const filter = filterInput.value;

    let visibleTasks = tasks.filter(task => {
        const matchesSearch = task.title.toLowerCase().includes(query);

        const matchesFilter =
            filter === "all" ||
            (filter === "pending" && !task.completed) ||
            (filter === "completed" && task.completed);

        return matchesSearch && matchesFilter;
    });

    // Sort pending tasks before completed tasks.
    visibleTasks.sort((a, b) => {
        if (a.completed !== b.completed) {
            return Number(a.completed) - Number(b.completed);
        }
        return b.createdAt - a.createdAt;
    });

    if (visibleTasks.length === 0) {
        let message = "Add your first task to get started.";

        if (query) message = "Try another search term.";
        else if (filter === "pending") message = "You're all caught up!";
        else if (filter === "completed") message = "No completed tasks yet.";

        taskList.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📝</div>
                <h4>No tasks found</h4>
                <p>${escapeHTML(message)}</p>
            </div>
        `;
    } else {
        taskList.innerHTML = visibleTasks.map(task => `
            <div class="task-item ${task.completed ? "completed" : ""}">
                <button
                    type="button"
                    class="check-btn ${task.completed ? "checked" : ""}"
                    data-action="toggle"
                    data-id="${task.id}"
                    aria-label="${task.completed ? "Mark pending" : "Mark completed"}"
                    title="${task.completed ? "Mark pending" : "Complete task"}"
                >${task.completed ? "✓" : ""}</button>

                <div class="task-content">
                    <div class="task-title">${escapeHTML(task.title)}</div>
                    <div class="task-meta">
                        <span class="priority ${task.priority}">
                            ${escapeHTML(task.priority)}
                        </span>
                        <span class="task-date">
                            ${escapeHTML(formatDate(task.dueDate))}
                        </span>
                    </div>
                </div>

                <div class="task-actions">
                    <button
                        type="button"
                        class="action-btn"
                        data-action="edit"
                        data-id="${task.id}"
                        aria-label="Edit task"
                        title="Edit task"
                    >✎</button>

                    <button
                        type="button"
                        class="action-btn delete"
                        data-action="delete"
                        data-id="${task.id}"
                        aria-label="Delete task"
                        title="Delete task"
                    >✕</button>
                </div>
            </div>
        `).join("");
    }

    updateStats();
}

taskForm.addEventListener("submit", event => {
    event.preventDefault();

    const title = taskInput.value.trim();

    if (!title) {
        showToast("Please enter a task name.");
        taskInput.focus();
        return;
    }

    if (editingId !== null) {
        const task = tasks.find(item => item.id === editingId);

        if (task) {
            task.title = title;
            task.priority = priorityInput.value;
            task.dueDate = dueDateInput.value;
            showToast("Task updated successfully!");
        }

        editingId = null;
        submitBtn.textContent = "+ Add Task";
    } else {
        tasks.push({
            id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
            title,
            priority: priorityInput.value,
            dueDate: dueDateInput.value,
            completed: false,
            createdAt: Date.now()
        });

        showToast("Task added successfully!");
    }

    saveTasks();
    renderTasks();

    taskForm.reset();
    priorityInput.value = "Medium";
    taskInput.focus();
});

taskList.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;
    const task = tasks.find(item => item.id === id);

    if (!task) return;

    if (action === "toggle") {
        task.completed = !task.completed;
        showToast(task.completed ? "Task completed! 🎉" : "Task marked pending.");
    }

    if (action === "delete") {
        if (!confirm("Are you sure you want to delete this task?")) return;

        tasks = tasks.filter(item => item.id !== id);

        if (editingId === id) cancelEdit();

        showToast("Task deleted.");
    }

    if (action === "edit") {
        editingId = id;
        taskInput.value = task.title;
        priorityInput.value = task.priority;
        dueDateInput.value = task.dueDate || "";
        submitBtn.textContent = "Save Changes";
        taskInput.focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
        showToast("Edit your task and save changes.");
        return;
    }

    saveTasks();
    renderTasks();
});

function cancelEdit() {
    editingId = null;
    taskForm.reset();
    priorityInput.value = "Medium";
    submitBtn.textContent = "+ Add Task";
}

searchInput.addEventListener("input", renderTasks);
filterInput.addEventListener("change", renderTasks);

document.getElementById("clearCompletedBtn").addEventListener("click", () => {
    const completedCount = tasks.filter(task => task.completed).length;

    if (completedCount === 0) {
        showToast("There are no completed tasks to clear.");
        return;
    }

    if (!confirm(`Delete all ${completedCount} completed task(s)?`)) return;

    tasks = tasks.filter(task => !task.completed);

    if (editingId !== null && !tasks.some(task => task.id === editingId)) {
        cancelEdit();
    }

    saveTasks();
    renderTasks();
    showToast("Completed tasks cleared.");
});

renderTasks();
</script>
</body>
</html>
